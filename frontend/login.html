<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion de Parc Informatique</title>

    <!-- Police Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Principal -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Font Awesome (pour les icônes) via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* Styles spécifiques pour la page de connexion — mêmes tokens que le
           reste de l'application (voir assets/css/style.css :root) */
        body {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            background: var(--color-surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--color-text);
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: 600;
        }

        .login-header p {
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

        .login-icon {
            font-size: 3rem;
            color: var(--color-primary);
            margin-bottom: 20px;
        }

        .login-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        .form-group .input-icon {
            position: relative;
        }

        .form-group .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
        }

        .form-group .input-icon input {
            padding-left: 45px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.15s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: var(--color-primary-dark);
        }

        .login-btn:disabled {
            background: var(--color-border);
            color: var(--color-text-muted);
            cursor: not-allowed;
        }

        .error-message {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .success-message {
            background: var(--color-success-bg);
            color: var(--color-success);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            color: var(--color-text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-desktop"></i>
            </div>
            <h1>ParcInfo</h1>
            <p>Gestion de Parc Informatique</p>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="login">Identifiant</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="login" name="login" placeholder="Votre identifiant" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
                </div>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                <span id="btn-text">Se connecter</span>
                <div class="loading" id="loading">
                    <i class="fas fa-spinner"></i>
                </div>
            </button>
        </form>

        <div class="footer">
            <p>&copy; 2025 ParcInfo - Système de Gestion de Parc Informatique</p>
        </div>
    </div>

    <!-- jQuery via CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Script de connexion -->
    <script src="assets/js/login.js"></script>
</body>
</html>
